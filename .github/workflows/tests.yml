name: LoopGrid LangChain Integration CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Core/adapter security tests
        run: python -m pytest -q --cov=loopgrid_langchain --cov-fail-under=90
      - name: Actual LangChain create_agent smoke
        run: python scripts/native_agent_e2e.py
      - name: Release source and documentation audit
        run: python scripts/check_release_source.py
      - name: Python compilation
        run: python -m compileall -q src tests scripts
      - name: Build distributions
        run: python -m build
      - name: Metadata validation
        run: python -m twine check dist/*
      - name: Archive content audit
        run: python scripts/check_dist.py
  wheel-consumer:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Fresh wheel consumer environment
        shell: bash
        run: |
          python -m venv /tmp/lc-consumer
          /tmp/lc-consumer/bin/python -m pip install dist/*.whl
          /tmp/lc-consumer/bin/python -c 'from loopgrid_langchain import LangChainBridge, CoreClient, create_loopgrid_middleware; import langchain; print("PASS native consumer")'
          /tmp/lc-consumer/bin/python -m pip check
