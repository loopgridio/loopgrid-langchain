[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgrid-langchain"
version = "0.1.0"
description = "Native LangChain agent middleware for LoopGrid signed decision evidence, policy gates and guarded tool execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name="LoopGrid"}]
keywords = ["langchain", "langgraph", "ai-agents", "decision-evidence", "ai-governance", "tool-safety", "ed25519", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["langchain>=1.2,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "pytest-asyncio>=0.23,<2", "build>=1.2,<2", "twine>=6,<8", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://loopgrid.io/"
Documentation = "https://loopgrid.io/docs/"
Repository = "https://github.com/loopgridio/loopgrid-langchain"
Issues = "https://github.com/loopgridio/loopgrid-langchain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
